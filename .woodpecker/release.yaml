when:
  - repo: wvhulle/lazaret
    event: [push, manual]
    branch: main

labels:
  host: ryzen

depends_on:
  - checks

clone:
  - name: clone-with-history
    image: woodpeckerci/plugin-git
    settings:
      depth: 0
      partial: false
      tags: true

variables:
  - &nix_environment
    XDG_CACHE_HOME: /woodpecker/nix-cache
    NIX_CONFIG: |
      experimental-features = nix-command flakes
      extra-substituters = https://wvhulle.cachix.org
      extra-trusted-public-keys = wvhulle.cachix.org-1:heXx8DZMiRsKUx6l1TxNoF+Nmtmz66QEdsonQzc1ir0=
  - &bot_environment
    <<: *nix_environment
    GIT_AUTHOR_NAME: wvhulle-bot
    GIT_AUTHOR_EMAIL: willemvanhulle@protonmail.com
    GIT_COMMITTER_NAME: wvhulle-bot
    GIT_COMMITTER_EMAIL: willemvanhulle@protonmail.com
    CODEBERG_TOKEN:
      from_secret: bot_token

steps:
  - name: tag-and-release
    image: nixos/nix:latest
    environment: *bot_environment
    commands:
      - nix run --quiet .#release

  - name: update-release-pr
    image: nixos/nix:latest
    depends_on: [tag-and-release]
    environment: *bot_environment
    commands:
      - nix run --quiet .#release-pr
