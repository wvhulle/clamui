[package]
name = "lazaret-settings-helper"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[lints.clippy]
enum_variant_names = "allow"

[dependencies]
rustix = { version = "1", features = ["fs"] }
tempfile = "3"
thiserror = "2"
tokio = { version = "1.54", features = ["rt"] }
zbus = { version = "5.19", default-features = false, features = ["blocking-api", "tokio"] }

