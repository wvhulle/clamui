[package]
name = "clamui"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[[bin]]
name = "clamui"
path = "src/main.rs"

[dependencies]
bytesize = "2"
futures = "0.3.34"
gettext-rs = { version = "0.8", features = ["gettext-system"] }
hex = "0.4"
humantime = "2.4"
relm4 = { version = "0.11", features = ["libadwaita", "gnome_47"] }
rustix = { version = "1", features = ["fs", "process"] }
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
tokio = { version = "1.54", features = ["io-util", "process", "rt", "time"] }
tokio-stream = { version = "0.1", features = ["io-util"] }
turso = { version = "=0.8.3", default-features = false }

[dev-dependencies]
rusqlite = { version = "0.41", features = ["bundled"] }
tokio = { version = "1.54", features = ["macros", "rt-multi-thread"] }
